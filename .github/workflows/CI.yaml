name: CI
on:
  push:
    branches: [main]
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'The tag of the image to use for the container'
        required: false
        default: ''

jobs:
  integration-test-in-studio-container:
    uses: PickNikRobotics/moveit_pro_ci/.github/workflows/workspace_integration_test.yaml@d12201d45eaa1fd65fec5d201340ac85b4dd63b8 # v0.10.1
    with:
      runner: "ubuntu-22.04"
      # Pro 10.x images are published as moveit-pro, Jazzy only; the default image_ref is the 9.x moveit-studio name.
      image_tag: ${{ github.event.inputs.image_tag || '10.2.1' }}
      image_ref: picknikciuser/moveit-pro:${{ github.event.inputs.image_tag || '10.2.1' }}-{0}
      ros_distros: '["jazzy"]'
      colcon_test_args: "--executor sequential"
    secrets:
      moveit_license_key: ${{ secrets.STUDIO_CI_LICENSE_KEY }}

  ensure-no-ssh-in-gitmodules:
    name: Ensure no SSH URLs in .gitmodules
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v3
      - name: Check .gitmodules file for Git-over-SSH URLs
        run: "! grep 'git@' .gitmodules"
