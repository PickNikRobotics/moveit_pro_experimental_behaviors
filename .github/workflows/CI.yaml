name: CI
on:
  push:
    branches: [main]
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'The tag of the image to use for the container'
        required: false
        default: ''

jobs:
  integration-test-in-studio-container:
    uses: PickNikRobotics/moveit_pro_ci/.github/workflows/workspace_integration_test.yaml@v0.0.7
    with:
      runner: "ubuntu-22.04"
      # Pinned to the newest MoveIt Pro release, not the branch under test. This
      # used to resolve to the base ref, so a PR into main built against
      # picknikciuser/moveit-studio:main-humble - Pro's unreleased 10.0 line,
      # where SharedResourcesNode no longer exposes the protected
      # shared_resources_ member (it is a private behavior_context_ behind
      # getBehaviorContext()). Every behavior here uses shared_resources_, so the
      # whole package failed to compile regardless of what a PR changed. Bump this
      # when the package is migrated to a newer release.
      image_tag: ${{ github.event.inputs.image_tag || '9.4.1' }}
      colcon_test_args: "--executor sequential"
    secrets:
      moveit_license_key: ${{ secrets.STUDIO_CI_LICENSE_KEY }}

  ensure-no-ssh-in-gitmodules:
    name: Ensure no SSH URLs in .gitmodules
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v3
      - name: Check .gitmodules file for Git-over-SSH URLs
        run: "! grep 'git@' .gitmodules"
